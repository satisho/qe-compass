# Server deployment with PostgreSQL. From the project root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Put a TLS-terminating reverse proxy in front and set QEC_COOKIE_SECURE=true.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qecompass
      POSTGRES_USER: qecompass
      POSTGRES_PASSWORD: ${QEC_DB_PASSWORD:?set QEC_DB_PASSWORD in deploy/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qecompass"]
      interval: 5s
      retries: 20
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      QEC_DATABASE_URL: postgresql+psycopg://qecompass:${QEC_DB_PASSWORD}@db:5432/qecompass
      QEC_COOKIE_SECURE: ${QEC_COOKIE_SECURE:-false}
    volumes: [uploads:/data]
    ports: ["8000:8000"]
volumes:
  pgdata:
  uploads:
